name: whatsapp-reader

x-runtime-security: &runtime-security
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *runtime-security
    build:
      context: .
      target: runtime
    image: whatsapp-reader:local
    container_name: whatsapp-reader
    command: ["node", "dist/ingest.js"]
    volumes:
      - whatsapp-data:/app/data
      - whatsapp-auth:/app/auth
    # Las paradas terminales suspenden sólo la reconexión dentro del proceso;
    # esta política conserva el arranque automático tras reiniciar Docker.
    restart: unless-stopped
    stop_grace_period: 30s
    stdin_open: true
    tty: true

volumes:
  whatsapp-data:
    name: whatsapp-reader-data
  whatsapp-auth:
    name: whatsapp-reader-auth
